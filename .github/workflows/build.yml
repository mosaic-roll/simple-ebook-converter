name: Build executables

on:
  workflow_dispatch:   # 手动触发
  release:
    types: [published]  # 发布新版本时自动触发

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Install nuitka
        run: uv pip install nuitka

      - name: Build CLI executable
        run: |
          nuitka `
            --standalone `
            --onefile `
            --windows-disable-console `
            --output-filename=simple-ebook-converter-cli.exe `
            --output-dir=dist `
            simple_ebook_converter/cli/cli.py

      - name: Build GUI executable
        run: |
          nuitka `
            --standalone `
            --onefile `
            --include-package=customtkinter `
            --windows-disable-console `
            --output-filename=simple-ebook-converter.exe `
            --output-dir=dist `
            simple_ebook_converter/gui/__main__.py

      - name: Package for release
        run: |
          Compress-Archive -Path dist/*.exe -DestinationPath simple-ebook-converter-windows.zip

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: simple-ebook-converter-windows.zip
