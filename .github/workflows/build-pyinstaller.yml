name: Build with PyInstaller

on:
  workflow_dispatch:   # 手动触发，只出 artifact，不发 Release
  push:
    tags:
      - "v*"         # 推 vX.Y.Z 标签：构建 → 冒烟测试 → 自动建 Release 并上传

permissions:
  contents: write

# 同一个标签重复触发时排队而不是并发，避免两个任务往同一个 Release 传同一份产物
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        run: uv sync --extra gui

      - name: Install pyinstaller
        run: uv pip install pyinstaller

      # 版本号唯一来源是 pyproject.toml（_meta.__version__ 读的是包元数据），
      # 而版本号会被冻进 exe 里。标签和代码不一致的话，发布出去的 exe 会自称
      # 一个错误的版本，所以在花时间打包之前就拦下来。
      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+') {
            throw "标签格式应为 vX.Y.Z，实际：$tag"
          }
          $want = $tag -replace '^v', ''
          $pyproject = Get-Content pyproject.toml -Raw -Encoding UTF8
          if ($pyproject -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "pyproject.toml 里读不到 version"
          }
          $have = $Matches[1]
          if ($have -ne $want) {
            throw "标签 $tag 与 pyproject.toml 的 version = `"$have`" 不一致，先改版本号再打标签"
          }
          Write-Output "版本一致：$have"

      # 用 spec 打包，命令行版与图形界面版共用一份 _internal。
      # spec 里两个 EXE 各自设定 console=True/False，所以控制台行为天生正确，
      # 不需要任何运行时隐藏。详见 packaging/shared.spec 的说明。
      - name: Build with shared spec
        run: |
          uv run pyinstaller `
            --clean `
            --noconfirm `
            --distpath=dist `
            --workpath=build `
            packaging/shared.spec

      - name: Smoke test executables
        run: |
          $ErrorActionPreference = "Stop"
          # .NET 的 IO 方法按进程工作目录解析相对路径，不跟随 PowerShell 当前目录，
          # 所以先解析成绝对路径
          $root = (Resolve-Path "dist\simple-ebook-converter").Path

          function Get-Subsystem([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            return [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          }

          # 必须只有一份 _internal，否则说明 spec 没按预期共享依赖
          $internals = @(Get-ChildItem $root -Recurse -Directory -Filter "_internal")
          if ($internals.Count -ne 1) {
            throw "期望 1 份 _internal，实际 $($internals.Count) 份"
          }
          Write-Output "共享 _internal：1 份"

          # 命令行版：console(3)，输出正常
          $cli = Join-Path $root "simple-ebook-converter-cli.exe"
          if ((Get-Subsystem $cli) -ne 3) { throw "命令行版子系统不是 Console(3)" }
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw "命令行版 --version 退出码 $LASTEXITCODE" }
          & $cli --dump-css smoke.css
          if ($LASTEXITCODE -ne 0) { throw "命令行版 --dump-css 退出码 $LASTEXITCODE" }
          if (-not (Test-Path smoke.css)) { throw "命令行版未产出 smoke.css" }

          # 图形界面版：GUI(2)，双击没有控制台
          $gui = Join-Path $root "simple-ebook-converter.exe"
          if ((Get-Subsystem $gui) -ne 2) { throw "图形界面版子系统不是 GUI(2)" }
          Write-Output "子系统正确：命令行版=3，图形界面版=2"

      - name: Package
        run: |
          Compress-Archive -Path dist\simple-ebook-converter `
            -DestinationPath simple-ebook-converter-windows.zip -Force
          $zip = Get-Item simple-ebook-converter-windows.zip
          "{0,-45} {1,7:N1} MB" -f $zip.Name, ($zip.Length / 1MB)

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true      # 用 GitHub 自动生成的变更说明
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true     # 没匹配到产物就失败，别悄悄发个空 Release
          files: simple-ebook-converter-windows.zip

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: simple-ebook-converter-windows.zip