name: Build onedir with PyInstaller

on:
  workflow_dispatch:   # 手动触发
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        run: uv sync --extra gui

      - name: Install pyinstaller
        run: uv pip install pyinstaller

      - name: Build CLI executable
        run: |
          uv run pyinstaller `
            --clean `
            --noconfirm `
            --name=simple-ebook-converter-cli `
            --distpath=dist `
            --paths=src `
            --copy-metadata=simple-ebook-converter `
            --add-data="simple_ebook_converter/_meta.py:simple_ebook_converter" `
            src/simple_ebook_converter/launcher.py --cli

      - name: Build GUI executable
        run: |
          uv run pyinstaller `
            --clean `
            --noconfirm `
            --noconsole `
            --name=simple-ebook-converter `
            --distpath=dist `
            --hidden-import=customtkinter `
            --paths=src `
            --copy-metadata=simple-ebook-converter `
            src/simple_ebook_converter/launcher.py

      - name: Package for release
        run: |
          Compress-Archive -Path dist/* -DestinationPath simple-ebook-converter-windows-pyinstaller.zip -Force

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: simple-ebook-converter-windows-pyinstaller.zip
