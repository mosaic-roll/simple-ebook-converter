name: Build with PyInstaller

on:
  workflow_dispatch:   # 手动触发
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Install pyinstaller
        run: uv pip install pyinstaller

      - name: Create output directory
        run: mkdir -p dist

      - name: Build CLI executable
        run: |
          pyinstaller `
            --onefile `
            --clean `
            --noconfirm `
            --name=simple-ebook-converter-cli `
            --distpath=dist `
            --workpath=build `
            src/simple_ebook_converter/cli/cli.py

      - name: Build GUI executable
        run: |
          pyinstaller `
            --onefile `
            --clean `
            --noconfirm `
            --name=simple-ebook-converter `
            --distpath=dist `
            --workpath=build `
            --hidden-import=customtkinter `
            src/simple_ebook_converter/gui/__main__.py

      - name: Package for release
        run: |
          Compress-Archive -Path dist/*.exe -DestinationPath simple-ebook-converter-windows-pyinstaller.zip -Force

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: simple-ebook-converter-windows-pyinstaller.zip
