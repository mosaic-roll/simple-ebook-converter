name: Build onedir with PyInstaller

on:
  workflow_dispatch:   # 手动触发
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        run: uv sync --extra gui

      - name: Install pyinstaller
        run: uv pip install pyinstaller

      - name: Build universal executable
        run: |
          uv run pyinstaller `
            --clean `
            --noconfirm `
            --name=simple-ebook-converter `
            --distpath=dist `
            --hidden-import=customtkinter `
            --paths=src `
            --copy-metadata=simple-ebook-converter `
            src/simple_ebook_converter/launcher.py

      - name: Build dedicated GUI executable
        run: |
          uv run pyinstaller `
            --clean `
            --noconfirm `
            --noconsole `
            --name=simple-ebook-converter-gui `
            --distpath=dist `
            --hidden-import=customtkinter `
            --paths=src `
            --copy-metadata=simple-ebook-converter `
            src/simple_ebook_converter/launcher.py

      - name: Build dedicated CLI executable
        run: |
          uv run pyinstaller `
            --clean `
            --noconfirm `
            --name=simple-ebook-converter-cli `
            --distpath=dist `
            --hidden-import=customtkinter `
            --paths=src `
            --copy-metadata=simple-ebook-converter `
            src/simple_ebook_converter/launcher.py

      - name: Smoke test executables
        run: |
          $ErrorActionPreference = "Stop"
          # 专用 CLI：不需要 --cli，双击即命令行
          & dist\simple-ebook-converter-cli\simple-ebook-converter-cli.exe --version
          & dist\simple-ebook-converter-cli\simple-ebook-converter-cli.exe --dump-css smoke.css
          if (-not (Test-Path smoke.css)) { throw "CLI 包未产出 smoke.css" }
          # 全能版：--cli 进命令行，不带参数进 GUI
          & dist\simple-ebook-converter\simple-ebook-converter.exe --cli --version
          & dist\simple-ebook-converter\simple-ebook-converter.exe --version
          # GUI 专用：确认 PE 子系统是 GUI(2)，双击不会有控制台
          $bytes = [System.IO.File]::ReadAllBytes(
            "dist\simple-ebook-converter-gui\simple-ebook-converter-gui.exe")
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          if ($subsystem -ne 2) { throw "GUI 包 subsystem=$subsystem，应为 2" }
          Write-Output "GUI 包 subsystem=2，无控制台"

      - name: Package for release
        run: |
          Compress-Archive -Path dist/* -DestinationPath simple-ebook-converter-windows-pyinstaller.zip -Force

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: simple-ebook-converter-windows-pyinstaller.zip
