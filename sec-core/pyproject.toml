[project]
name = "sec-core"
version = "0.1.0"
description = "TXT 转 EPUB3 核心库：解析、切分、清理、替换、组装（CLI 与 GUI 共用）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chardet>=7.6.0",
    "ebooklib>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
