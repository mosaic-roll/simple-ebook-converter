[project]
name = "sec-cli"
version = "0.1.0"
description = "TXT 转 EPUB3 命令行工具"
readme = "README.md"
authors = [
    { name = "mosaic-roll", email = "48566087+mosaic-roll@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "sec-core",
]

[project.scripts]
sec-cli = "sec_cli.cli:main"

[tool.uv.sources]
sec-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
