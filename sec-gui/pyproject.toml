[project]
name = "sec-gui"
version = "0.1.0"
description = "TXT 转 EPUB3 图形界面工具（Tkinter）"
requires-python = ">=3.12"
dependencies = [
    "sec-cli",
]

[project.scripts]
sec-gui = "sec_gui.app:main"

[tool.uv.sources]
sec-cli = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]