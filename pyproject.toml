[project]
name = "simple-ebook-converter"
version = "0.1.0"
description = "TXT 转 EPUB3 工具：核心库 + 命令行前端 + 图形界面前端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chardet>=7.6.0",
    "click>=8.5.0",
    "ebooklib>=0.20",
]

[project.optional-dependencies]
#: 只有图形界面需要。core 与命令行不装它也能用：
#:   pip install simple-ebook-converter           # 仅 CLI
#:   pip install "simple-ebook-converter[gui]"   # 带图形界面（customtkinter）
gui = [
    "customtkinter>=5.2",
]

[project.scripts]
simple-ebook-converter = "simple_ebook_converter.gui_ctk.__main__:main"
simple-ebook-converter-cli = "simple_ebook_converter.cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
